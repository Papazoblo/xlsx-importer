server:
  ssl:
    key-store: classpath:xlsx-importer.jks
    key-store-password: password
    key-store-type: jks
    key-alias: xlsx-importer
    key-password: 2x8c63tk
    enabled: false
  port: 8080



feign:
  client:
    config:
      vtbOpeningApi:
        loggerLevel: full
      vtbAuth:
        loggerLevel: full
      vtbApi:
        loggerLevel: full
      alfaApi:
        loggerLevel: full
      raiffeisenApi:
        loggerLevel: full
      skorozvon:
        loggerLevel: basic
      skorozvonAuth:
        loggerLevel: basic

logging:
  file:
    name: /opt/xlsx-importer/logs/application.log
  level:
    ru.medvedev.importer: DEBUG

spring:
  profiles:
    active: default
  task:
    scheduling:
      pool:
        size: 5
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
  flyway:
    locations: 'classpath:db/migration/xlsx'
  datasource:
    xlsx-importer:
      jdbc-url: jdbc:postgresql://127.0.0.1:5432/xlsx_importer_db
      driver-class-name: org.postgresql.Driver
    play-sound-ds:
      jdbc-url: jdbc:postgresql://127.0.0.1:5432/sound_play_db
      driver-class-name: org.postgresql.Driver
  jpa:
    properties:
      hibernate:
        enable_lazy_load_no_trans: true
  main:
    allow-bean-definition-overriding: true
  thymeleaf:
    cache: false

directory:
  upload-dir: /opt/xlsx-importer/storage

cron:
  fixed-rate-update-token: 1200000
  fixed-rate-check-xlsx-exists: 900000
  launch-file-processing: '0 * * * * *'
  ending-file-processing: '30 * * * * *'
  webhook-statistic: '0 20 18 * * *'
  tg-column-header-request: '*/3 * * * * *'
  tg-initialized-new-file: '*/3 * * * * *'
  tg-file-body-processor: '*/3 * * * * *'
  tg-file-send-to-check: '2 */1 * * * *'
  creating-request-vtb: '*/15 * * * * *'
  creating-request-opening: '40 * * * * *'
  creating-request-alfa: '*/2 * * * * *'
  creating-request-raiffeisen: '50 * * * * *'
  check-request-status-vtb: '*/35 * * * * *'
  check-request-status-alfa: '*/3 * * * * *'
  check-request-status-opening: '*/10 * * * * *'
  tg-file-send-to-skorozvon: '*/2 * * * * *'
  webhook-from-fixed-status: '17 */1 * * * *'
  webhook-from-try-to-create-status: '30 */1 * * * *'
  webhook-from-create-success-status: '45 */1 * * * *'
  webhook-check-status: '20 */2 * * * *'
  auto-load: '0 0 3 * * *'
  logs-archive-delete: '0 0 2 * * *'
  first-load-lead-delete: '0 0 1 * * *'
  raiffeisen-city-dictionary: '0 10 2 * * *'
  request-unpause: '0 10 0 * * *'
  request-18-30-unpause: '0 30 18 * * *'
  close-parts-load: '10 */2 * * * *'

telegram:
  xlsx-collector:
    botName: Xlsx collector
    reconnectTimer: 10000
  notificator:
    botName: Notificator
    reconnectTimer: 10000

skorozvon:
  url: https://app.skorozvon.ru

vtb:
  url: https://gw.api.vtb.ru:443/openapi/smb/lecs/lead-impers/v1
  token-url: https://open.api.vtb.ru:443/passport/oauth2/token

vtb-opening:
  url: https://openpartners.ru/api/v2/request
  url-add-request: /add
  url-check-request-status: /status
  url-check-inn: /getduplicates

raiffeisen:
  url: https://api.raiffeisen.ru/private/openapi-013-ssl/corporate-leads-xs/app
  dict-url: https://api.raiffeisen.ru/private/openapi-006/dictionaries/cities
  partner-id: "000117"

alfa:
  api-key: 5d590b3b-3174-42ed-a080-241f4864f19f
  url: https://partner.alfabank.ru/public-api/v2
  url-add-request: /leads
  url-request-status: /leads/{id}
  url-check-inn: /checks
  dict-url: /dictionaries?code=cities
