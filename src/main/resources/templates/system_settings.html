<!DOCTYPE HTML>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">

    <title>Xlsx importer</title>

    <link rel="stylesheet" th:href="@{/webjars/bootstrap/4.6.0-1/css/bootstrap.min.css}"/>
    <link rel="stylesheet" th:href="@{/webjars/font-awesome/6.1.1/css/fontawesome.min.css}"/>
    <link rel="stylesheet" th:href="@{/webjars/font-awesome/6.1.1/css/solid.min.css}"/>
    <link rel="stylesheet" th:href="@{/css/main.css}"/>

</head>

<!-- Navigation -->
<div th:insert="navigation_fragment.html"></div>
<body>

<main role="main" class="container">
    <div class="row mt-4">
        <div class="col-md-8 offset-md-2">
            <table id="mainTable">
                <tr>
                    <th><label for="maxErrorNumber">Номер отказ/недозвон</label></th>
                    <th>
                        <input id="maxErrorNumber" type="text" class="onlyNumbers" th:text="${name}"
                               th:value="${variables.getOrDefault(T(ru.medvedev.importer.enums.SystemVariable).MAX_ERROR_NUMBER, '')}"/>
                    </th>
                </tr>
                <tr>
                    <th><label for="checkLimitAlfa">Ежедневный лимит проверок в Альфа</label></th>
                    <th>
                        <input id="checkLimitAlfa" type="text" class="onlyNumbers" th:text="${name}"
                               th:value="${variables.getOrDefault(T(ru.medvedev.importer.enums.SystemVariable).CHECK_LIMIT_ALFA, '')}"/>
                    </th>
                </tr>
                <tr>
                    <th><label for="halfCheckLimitAlfa">Ллимит проверок в Альфа до 18:30</label></th>
                    <th>
                        <input id="halfCheckLimitAlfa" type="text" class="onlyNumbers" th:text="${name}"
                               th:value="${variables.getOrDefault(T(ru.medvedev.importer.enums.SystemVariable).HALF_CHECK_LIMIT_ALFA, '')}"/>
                    </th>
                </tr>
                <tr>
                    <th></th>
                    <th style="text-align: right; width: 100px">
                        <button id="btn-save" class="btn-2" style="width: 50%">Сохранить</button>
                    </th>
                </tr>
            </table>
        </div>
    </div>
</main>
<!-- /.container -->

<script type="text/javascript" th:src="@{/webjars/jquery/3.5.1/jquery.min.js}"></script>
<script type="text/javascript" th:src="@{/webjars/popper.js/1.16.0/umd/popper.min.js}"></script>
<script type="text/javascript" th:src="@{/webjars/bootstrap/4.6.0-1/js/bootstrap.min.js}"></script>
<script type="text/javascript" th:src="@{/js/system_setting.js}"></script>

</body>
</html>
