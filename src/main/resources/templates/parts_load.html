<!DOCTYPE HTML>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">

    <title>Xlsx importer</title>

    <link rel="stylesheet" th:href="@{/webjars/bootstrap/4.6.0-1/css/bootstrap.min.css}"/>
    <link rel="stylesheet" th:href="@{/webjars/bootstrap-multiselect/1.1.1/css/bootstrap-multiselect.css}"/>
    <link rel="stylesheet" th:href="@{/webjars/font-awesome/6.1.1/css/fontawesome.min.css}"/>
    <link rel="stylesheet" th:href="@{/webjars/font-awesome/6.1.1/css/solid.min.css}"/>
    <link rel="stylesheet" th:href="@{/webjars/bootstrap-datetimepicker/2.4.4/css/bootstrap-datetimepicker.css}"/>
    <link rel="stylesheet" th:href="@{/webjars/bootstrap-glyphicons/bdd2cbfba0/css/bootstrap-glyphicons.css}"/>
    <link rel="stylesheet" th:href="@{/css/main.css}"/>

</head>


<!-- Navigation -->
<div th:insert="navigation_fragment.html"></div>

<body>
<main role="main" class="container">

    <div th:class="row">

        <div class="col-md-3">
            <label for="createDateFrom">Дата создания с</label>
            <div class="input-group date" id="createDateFromId">
                <input id="createDateFrom" type="text" value="" class="form-control" required=""/>
                <div class="input-group-addon input-group-append">
                    <div class="input-group-text">
                        <i class="glyphicon glyphicon-calendar fa fa-calendar"></i>
                    </div>
                </div>
            </div>
        </div>
        <div class="col-md-3">
            <label for="createDateTo">Дата создания по</label>
            <div class="input-group date" id="createDateToId">
                <input id="createDateTo" type="text" value="" class="form-control" required=""/>
                <div class="input-group-addon input-group-append">
                    <div class="input-group-text">
                        <i class="glyphicon glyphicon-calendar fa fa-calendar"></i>
                    </div>
                </div>
            </div>
        </div>
        <div class="col-md-2">
            <label for="leadCount">Количество лидов</label>
            <input id="leadCount" type="text" class="onlyNumbers"/>
        </div>
        <div class="col-md-2">
            <label for="bankFilter">Банк</label>
            <select data-style="bg-white rounded-pill px-4 py-3 shadow-sm "
                    class="selectpicker w-100 "
                    id="bankFilter">
                <option th:each="bank : ${banks}" th:value="${bank.name()}" th:text="${bank.title}">
                </option>
            </select>
        </div>
        <div class="col-md-2">
            <button class="btn-2" type="submit" id="startPartsLoad" name="action"
                    style="position: absolute; bottom: -13px; width: 75%;">
                Загрузить
            </button>
        </div>
    </div>
    <div th:class="row">
        <div class="col-md-12">
            <table id="contacts" class="table table-bordered table-responsive-sm">
                <thead>
                <tr>
                    <th>Дата с</th>
                    <th>Дата по</th>
                    <th>Количество</th>
                    <th>Банк</th>
                    <th>Дата проведения</th>
                    <th>Статус</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="load : ${loads}">
                    <td th:text="${load.getDateFrom()}">dateFrom</td>
                    <td th:text="${load.getDateTo()}">dateTo</td>
                    <td th:text="${load.getCount()}">count</td>
                    <td th:text="${load.getBank()}">bank</td>
                    <td th:text="${load.getCreateDate()}">createDate</td>
                    <td th:text="${load.getStatus()}">status</td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>

    <nav aria-label="Page navigation" class="paging">
        <ul class="pagination" th:if="${loads.totalPages > 1}">
            <li class="page-item" th:classappend="${!paging.isPrevEnabled()? 'disabled' : ''}">
                <a class="page-link"
                   th:href="@{'/parts-load' + '?page=' + ${paging.pageNumber - 1}}"
                   tabindex="-1">Previous</a>
            </li>
            <th:block th:each="item : ${paging.getItems()}">
                <li class="page-item" th:classappend="${item.index == paging.pageNumber? 'active' : ''}"
                    th:if="${item.pageItemType.name() == 'PAGE'}">
                    <a class="page-link" th:href="@{'/parts-load' + '?page=' + ${item.index}}"
                       th:text="${item.index}"></a>
                </li>
                <li class="page-item disabled" th:if="${item.pageItemType.name() == 'DOTS'}">
                    <a class="page-link" href="#">...</a>
                </li>
            </th:block>
            <li class="page-item" th:classappend="${!paging.isNextEnabled()? 'disabled' : ''}">
                <a class="page-link"
                   th:href="@{'/parts-load' + '?page=' + ${paging.pageNumber + 1}}">Next</a>
            </li>
        </ul>
    </nav>
</main>
<!-- /.container -->

<script type="text/javascript" th:src="@{/webjars/jquery/3.5.1/jquery.min.js}"></script>
<script type="text/javascript" th:src="@{/webjars/popper.js/1.16.0/umd/popper.min.js}"></script>
<script type="text/javascript" th:src="@{/webjars/bootstrap/4.6.0-1/js/bootstrap.min.js}"></script>
<script type="text/javascript" th:src="@{/webjars/bootstrap-multiselect/1.1.1/js/bootstrap-multiselect.js}"></script>
<script type="text/javascript"
        th:src="@{/webjars/bootstrap-datetimepicker/2.4.4/js/bootstrap-datetimepicker.js}"></script>
<script type="text/javascript"
        th:src="@{/webjars/bootstrap-datetimepicker/2.4.4/js/locales/bootstrap-datetimepicker.ru.js}"></script>
<script type="text/javascript" th:src="@{/js/parts_load.js}"></script>
<script type="text/javascript">
    $(document).ready(function () {
        $('.date').datetimepicker({
            format: 'dd.mm.yyyy hh:ii',
            language: 'ru',
            icons: {
                time: "fa-solid fa-clock-o",
                date: "fa-solid fa-calendar",
                up: "fa-solid fa-arrow-up",
                down: "fa-solid fa-arrow-down",
                previous: "fa-solid fa-chevron-left",
                next: "fa-solid fa-chevron-right",
                today: "fa-solid fa-clock-o",
                clear: "fa-solid fa-trash-o"
            }
        });
    });
</script>
<script>
    $(document).ready(function () {
        $('.selectpicker').multiselect({
            nonSelectedText: 'Не выбрано',
            nSelectedText: 'выбран(о)',
            numberDisplayed: 1,
            allSelectedText: 'Все выбрано',
            resetText: 'Сбросить',
            maxHeight: 500
        });
    });
</script>
</body>
</html>
